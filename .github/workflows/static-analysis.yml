name: Static Analysis Pipeline

on:
  push:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    env:
      MAIN_DATABASE_URL: mongodb://localhost:27017/main
      BUSINESS_DATABASE_URL: mongodb://localhost:27017/business

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma-generate

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npx eslint .

  test:
    needs: static-analysis
    runs-on: ubuntu-latest
    env:
      MAIN_DATABASE_URL: mongodb://localhost:27017/main
      BUSINESS_DATABASE_URL: mongodb://localhost:27017/admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma-generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage/lcov.info
          retention-days: 14

  e2e-test:
    needs: static-analysis
    runs-on: ubuntu-latest
    env:
      MAIN_DATABASE_URL: mongodb://localhost:27017/main
      BUSINESS_DATABASE_URL: mongodb://localhost:27017/admin
      E2E_BYPASS_AUTH: "true"
      NEXTAUTH_URL: http://localhost:4100
      NEXTAUTH_SECRET: e2e-secret
      AUTH_SECRET: e2e-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma-generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  deploy-main:
    needs: [static-analysis, test, e2e-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook (Main)
        run: curl -X POST https://api.vercel.com/v1/integrations/deploy/prj_khm35phZsO8Sb8K8Z1c2lpKji9Ja/2jtIBdiDGO

  deploy-staging:
    needs: [static-analysis, test, e2e-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook (Staging)
        run: curl -X POST https://api.vercel.com/v1/integrations/deploy/prj_khm35phZsO8Sb8K8Z1c2lpKji9Ja/8dzsBfhXTJ
