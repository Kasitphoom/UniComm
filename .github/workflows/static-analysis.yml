name: Static Analysis Pipeline

on:
  push:
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    env:
      MAIN_DATABASE_URL: mongodb://localhost:27017/main
      BUSINESS_DATABASE_URL: mongodb://localhost:27017/business

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma-generate

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npx eslint .
